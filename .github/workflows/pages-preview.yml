name: Publish English Learning AI to public GitHub Pages (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_public_publish:
        description: "I confirm this publishes the feature branch to the public GitHub Pages URL."
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-manual
  cancel-in-progress: true

jobs:
  deploy:
    if: inputs.confirm_public_publish == true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7

      - name: Prepare complete static frontend
        run: |
          mkdir -p _site
          cp index.html styles.css app.js flashcards.css flashcards.js manifest.webmanifest icon.svg sw.js _site/
          touch _site/.nojekyll

      - name: Verify static bundle and offline assets
        run: |
          python - <<'PY'
          from pathlib import Path

          site = Path("_site")
          required = (
              "index.html", "styles.css", "app.js", "flashcards.css",
              "flashcards.js", "manifest.webmanifest", "icon.svg", "sw.js",
          )
          missing = [name for name in required if not (site / name).is_file()]
          if missing:
              raise SystemExit(f"Missing static assets: {missing}")

          html = (site / "index.html").read_text(encoding="utf-8")
          for asset in ("styles.css", "flashcards.css", "app.js", "flashcards.js",
                        "manifest.webmanifest", "icon.svg"):
              if asset not in html:
                  raise SystemExit(f"index.html does not reference {asset}")

          worker = (site / "sw.js").read_text(encoding="utf-8")
          if 'url.pathname.includes("/api/")' not in worker:
              raise SystemExit("Service worker must never cache API responses")
          print("Complete static bundle verified.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v5
