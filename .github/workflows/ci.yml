name: Validate English Learning AI

on:
  push:
    branches:
      - feature/interactive-flashcards
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend syntax and integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check flashcards.js
      - name: Check frontend integration
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          app = Path("app.js").read_text(encoding="utf-8")
          cards = Path("flashcards.js").read_text(encoding="utf-8")
          assert 'data-view="flashcards"' in html
          assert 'flashcards.js' in html and 'flashcards.css' in html
          assert 'flashcards:[' in app
          assert 'daily-routine' in app
          assert 'SpeechRecognition' in app
          assert 'normalizeWords' in app
          assert 'ela-flashcards-known' in cards
          assert 'localStorage' in cards
          assert 'data-lesson-id="daily-routine"' in html
          print("Frontend integration checks passed.")
          PY

  backend:
    name: Backend API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run API tests
        working-directory: backend
        run: python -m pytest -q
